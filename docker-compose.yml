services:
  postgres:
    image: postgres:17-alpine
    container_name: arcticblue-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arcticblue}
      POSTGRES_USER: ${POSTGRES_USER:-your_postgres_username}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_postgres_password}
    ports:
      - "5432:5432"
    volumes:
      - arcticblue-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  arcticblue-postgres-data:
